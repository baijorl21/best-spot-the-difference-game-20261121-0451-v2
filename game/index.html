<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Look — spot the difference</title>
<style>
  html, body { margin: 0; height: 100%; background: #16233a; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 964px); height: auto; display: block; touch-action: manipulation; }

</style>

<canvas id="game" aria-label="Second Look: find the differences between two pictures. Click a difference, or move the ring with arrow keys and press Enter."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
